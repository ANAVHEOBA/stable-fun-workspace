[workspace]
members = [
    "programs/stable-fun",
]
resolver = "2"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
opt-level = "z"
debug = false
debug-assertions = false
panic = "abort"
incremental = false

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1

[workspace.dependencies]
anchor-lang = "=0.29.0"
anchor-spl = "=0.29.0"
solana-program = "=1.16.18"
switchboard-solana = "=0.28.32"
num_enum = "=0.7.3"